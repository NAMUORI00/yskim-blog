name: Build and deploy Hugo site

on:
  workflow_dispatch:
    inputs:
      content_source:
        description: Content source for this run.
        required: false
        default: configured
        type: choice
        options:
          - configured
          - notion
      notion_status:
        description: Notion status filter for generated content.
        required: false
        default: Published
        type: string
      production_branch:
        description: Branch that stores generated production content and deploys.
        required: false
        default: production
        type: string
      deploy:
        description: Publish the production branch and deploy after a successful manual build.
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: yskim-blog-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.162.1
  CONTENT_SOURCE: notion
  NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
  NOTION_STATUS: ${{ github.event.inputs.notion_status || vars.NOTION_STATUS || 'Published' }}
  PUBLISH_BRANCH: ${{ github.event.inputs.production_branch || vars.PUBLISH_BRANCH || 'production' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate build inputs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${CONTENT_SOURCE}" != "notion" ]]; then
            echo "CONTENT_SOURCE must be 'notion' for the single-repository publishing flow, got '${CONTENT_SOURCE}'." >&2
            exit 1
          fi
          if [[ "${PUBLISH_BRANCH}" == -* || "${PUBLISH_BRANCH}" == *..* || "${PUBLISH_BRANCH}" == *//* || ! "${PUBLISH_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "PUBLISH_BRANCH contains unsupported characters: ${PUBLISH_BRANCH}" >&2
            exit 1
          fi
          if [[ -z "${NOTION_DATABASE_ID:-}" ]]; then
            echo "NOTION_DATABASE_ID repository variable is required for Notion content." >&2
            exit 1
          fi
          if [[ -z "${NOTION_TOKEN:-}" ]]; then
            echo "NOTION_TOKEN repository secret is required for Notion content." >&2
            exit 1
          fi

          echo "Selected content source: ${CONTENT_SOURCE}"
          echo "Notion status filter: ${NOTION_STATUS}"
          echo "Production branch: ${PUBLISH_BRANCH}"

      - name: Fetch Notion content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: bash
        run: bash .github/scripts/fetch-content.sh

      - name: Validate exported content
        shell: bash
        run: bash .github/scripts/validate-content.sh

      - name: Markdown lint
        run: npx markdownlint-cli2 "README.md" "docs/**/*.md"

      - name: Build Pages Functions
        run: npx wrangler pages functions build functions --outdir "$RUNNER_TEMP/pages-functions-build"

      - name: Fetch GitHub profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash .github/scripts/fetch-github-profile.sh

      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
          mkdir "$RUNNER_TEMP/hugo-bin"
          tar -xzf hugo.tar.gz -C "$RUNNER_TEMP/hugo-bin"
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Build site
        run: hugo --gc --minify --cleanDestinationDir

      - name: Guard against development assets
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "livereload.js\|port=1313" public; then
            echo "Development-only livereload asset was found in the production build."
            exit 1
          fi

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: public-site
          path: public
          if-no-files-found: error

      - name: Upload generated source content
        uses: actions/upload-artifact@v7
        with:
          name: generated-content
          path: |
            content
            static/images
            static/files
            data/content-source.yaml
            data/github.yaml
          if-no-files-found: error

  publish-production:
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy != 'false')
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout project source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download generated content
        uses: actions/download-artifact@v8
        with:
          name: generated-content
          path: .

      - name: Commit generated production content
        id: commit
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${PUBLISH_BRANCH}:refs/remotes/origin/${PUBLISH_BRANCH}" || true
          git checkout -B "${PUBLISH_BRANCH}" "${GITHUB_SHA}"
          git add -f content static/images static/files data/content-source.yaml data/github.yaml

          if git diff --cached --quiet; then
            echo "No generated content changes to commit."
          else
            git commit -m "Publish generated blog content" -m "Source: ${COMMIT_MESSAGE}"
          fi

          production_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${PUBLISH_BRANCH}" --force-with-lease
          echo "sha=${production_sha}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - publish-production
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy != 'false')
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout project repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: public-site
          path: public

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event_name }}
          PRODUCTION_SHA: ${{ needs.publish-production.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy public \
            --project-name yskim-blog \
            --branch "${PUBLISH_BRANCH}" \
            --commit-hash "${PRODUCTION_SHA}" \
            --commit-message "${COMMIT_MESSAGE}"
