name: Build and deploy Hugo site

on:
  workflow_dispatch:
    inputs:
      content_source:
        description: Content source for this run.
        required: false
        default: configured
        type: choice
        options:
          - configured
          - repo
          - notion
      notion_status:
        description: Notion status filter when the selected source is notion.
        required: false
        default: Published
        type: string
      deploy:
        description: Deploy after a successful manual build.
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - content-updated

permissions:
  contents: read

concurrency:
  group: yskim-blog-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.162.1
  CONTENT_SOURCE: ${{ github.event_name == 'repository_dispatch' && 'repo' || ((github.event.inputs.content_source == 'repo' || github.event.inputs.content_source == 'notion') && github.event.inputs.content_source || vars.CONTENT_SOURCE || 'repo') }}
  NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
  NOTION_STATUS: ${{ github.event.inputs.notion_status || vars.NOTION_STATUS || 'Published' }}
  PRIVATE_CONTENT_DIR: .private-content

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate build inputs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          case "${CONTENT_SOURCE}" in
            repo|notion) ;;
            *)
              echo "CONTENT_SOURCE must be 'repo' or 'notion', got '${CONTENT_SOURCE}'." >&2
              exit 1
              ;;
          esac

          echo "Selected content source: ${CONTENT_SOURCE}"

          if [[ "${CONTENT_SOURCE}" == "notion" ]]; then
            if [[ -z "${NOTION_DATABASE_ID:-}" ]]; then
              echo "NOTION_DATABASE_ID repository variable is required for Notion content." >&2
              exit 1
            fi
            if [[ -z "${NOTION_TOKEN:-}" ]]; then
              echo "NOTION_TOKEN repository secret is required for Notion content." >&2
              exit 1
            fi
            echo "Notion status filter: ${NOTION_STATUS}"
          fi

      - name: Read content repository config
        id: content_repo
        if: env.CONTENT_SOURCE != 'notion'
        shell: bash
        run: |
          set -euo pipefail
          owner="NAMUORI00"
          name="yskim-blog-private"
          ref="main"
          if [[ -f hugo.yaml ]]; then
            block="$(awk '
              /^[[:space:]]*contentRepo:[[:space:]]*$/ { capture=1; next }
              capture && /^[[:space:]]*[A-Za-z0-9_]+:/ && $0 !~ /^[[:space:]]*(owner|name|ref|paths):/ { exit }
              capture { print }
            ' hugo.yaml | tr -d '\r')"
            parsed_owner="$(grep -E '^[[:space:]]*owner:' <<<"$block" | head -n1 | awk '{print $2}' | tr -d '\r')"
            parsed_name="$(grep -E '^[[:space:]]*name:' <<<"$block" | head -n1 | awk '{print $2}' | tr -d '\r')"
            parsed_ref="$(grep -E '^[[:space:]]*ref:' <<<"$block" | head -n1 | awk '{print $2}' | tr -d '\r')"
            [[ -n "$parsed_owner" ]] && owner="$parsed_owner"
            [[ -n "$parsed_name" ]] && name="$parsed_name"
            [[ -n "$parsed_ref" ]] && ref="$parsed_ref"
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "slug=${owner}/${name}" >> "$GITHUB_OUTPUT"

      - name: Checkout private content repository
        if: env.CONTENT_SOURCE != 'notion'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.content_repo.outputs.slug }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: ${{ env.PRIVATE_CONTENT_DIR }}
          ref: ${{ steps.content_repo.outputs.ref }}

      - name: Fetch content
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        shell: bash
        run: bash .github/scripts/fetch-content.sh

      - name: Validate exported content
        shell: bash
        run: bash .github/scripts/validate-content.sh

      - name: Markdown lint
        run: npx markdownlint-cli2 "content/**/*.md"

      - name: Build Pages Functions
        run: npx wrangler pages functions build functions --outdir "$RUNNER_TEMP/pages-functions-build"

      - name: Fetch GitHub profile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash .github/scripts/fetch-github-profile.sh

      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o hugo.tar.gz
          mkdir "$RUNNER_TEMP/hugo-bin"
          tar -xzf hugo.tar.gz -C "$RUNNER_TEMP/hugo-bin"
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"

      - name: Build site
        run: hugo --gc --minify --cleanDestinationDir

      - name: Guard against development assets
        shell: bash
        run: |
          set -euo pipefail
          if grep -R "livereload.js\|port=1313" public; then
            echo "Development-only livereload asset was found in the production build."
            exit 1
          fi

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: public-site
          path: public
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy != 'false') ||
      github.event_name == 'schedule'
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: public-site
          path: public

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy public \
            --project-name yskim-blog \
            --branch "${GITHUB_REF_NAME:-main}" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "$COMMIT_MESSAGE"
