{{ define "main" }}
  {{ partial "page-header.html" . }}

  <section class="post-feed">
    <div class="post-list">
      {{ range .Pages }}
        {{ partial "post-card.html" . }}
      {{ else }}
        <p class="empty-state">{{ site.Params.ui.noPagesFound }}</p>
      {{ end }}
    </div>
  </section>
{{ end }}
