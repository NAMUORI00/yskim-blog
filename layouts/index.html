{{ define "main" }}
  <section class="post-feed post-feed--home">
    <div class="section-heading section-heading--home">
      <h1>{{ site.Title }}</h1>
      <a class="section-link" href="{{ "/posts/" | relLangURL }}">{{ site.Params.ui.viewArchive }}</a>
    </div>
    {{ $posts := where site.RegularPages "Section" "posts" }}
    {{ if $posts }}
      <div class="post-list">
      {{ range first 10 $posts }}
        {{ partial "post-card.html" . }}
      {{ end }}
      </div>
    {{ else }}
      <p class="empty-state">{{ site.Params.ui.noPostsYet }}</p>
    {{ end }}
  </section>
{{ end }}
