{{ define "main" }}
  <article class="readme-card post">
    <div class="filebar">
      <span></span>
      <span></span>
      <span></span>
      <strong>pages/{{ .Params.slug | default .File.ContentBaseName }}.md</strong>
    </div>
    <div class="post-inner">
      <header class="post-header">
        <h1>{{ .Title }}</h1>
        {{ with .Params.summary }}<p class="summary">{{ . }}</p>{{ end }}
        {{ if eq .Params.slug "about" }}
          {{ partial "profile-bio.html" . }}
        {{ end }}
      </header>
      <div class="content">
        {{ .Content }}
      </div>
    </div>
  </article>
{{ end }}
