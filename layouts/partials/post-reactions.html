{{ $isPost := and .IsPage (eq .Section "posts") }}
{{ $pageAllowsComments := ne .Params.comments false }}
{{ if and $isPost $pageAllowsComments }}
  <section
    class="post-reactions"
    aria-labelledby="post-reactions-title"
    data-post-reactions
    data-path="{{ .RelPermalink }}"
    data-storage-key="yskim-reaction:{{ .RelPermalink }}"
  >
    <div class="post-reactions-heading">
      <p class="eyebrow" id="post-reactions-title">{{ site.Params.ui.reactions }}</p>
      <p class="post-reactions-status" data-reaction-status aria-live="polite"></p>
    </div>
    <div class="post-reaction-buttons" role="group" aria-label="{{ site.Params.ui.reactions }}">
      <button type="button" data-reaction-button data-reaction="like">
        <span>{{ site.Params.ui.reactionLike }}</span>
        <strong data-reaction-count="like">0</strong>
      </button>
      <button type="button" data-reaction-button data-reaction="useful">
        <span>{{ site.Params.ui.reactionUseful }}</span>
        <strong data-reaction-count="useful">0</strong>
      </button>
      <button type="button" data-reaction-button data-reaction="reread">
        <span>{{ site.Params.ui.reactionReread }}</span>
        <strong data-reaction-count="reread">0</strong>
      </button>
    </div>
  </section>
  <script src="{{ "/js/reactions.js" | relURL }}" defer></script>
{{ end }}
